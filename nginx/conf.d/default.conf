server {
    listen 80;
    server_name _;

    # index.html SIEMPRE revalidado (ETag/304): los scripts no se versionan,
    # así que sin esta cabecera el navegador puede servir JS viejo desde su
    # cache tras un despliegue y la app parece no actualizar nunca.
    location = / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Assets estáticos: revalidación barata (304 si no cambiaron), garantiza
    # que un deploy llegue al browser sin depender de Ctrl+F5.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Frontend estático
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API → backend
    location /api/ {
        proxy_pass http://moca-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
