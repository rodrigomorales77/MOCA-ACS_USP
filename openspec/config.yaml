schema: spec-driven

# MOCA ACS — OpenSpec SDD Configuration
# Generated by sdd-init (openspec mode) on 2026-08-27
# Hard rule: do not create openspec/ in engram mode; this file is the openspec source of truth.

context: |
  Tech stack: Node.js 20 + Express 4 (backend + ont-gateway), GenieACS (TR-069), MongoDB 4.4, SQLite (better-sqlite3), Docker Compose, nginx, vanilla HTML/CSS/JS (SPA)
  Architecture: Multi-service — moca-backend (REST API + SQLite + JWT + audit/pending-actions/firmware), moca-genieacs (NBI/CWMP/FS/UI), moca-gateway (ONT abstraction layer, device-index/task-runner, api-key auth), moca-mongodb, moca-nginx, tr069-simulator; gateway mapping engine + catalog
  Testing: No test runner detected (no jest/vitest/mocha/ava/pytest/go test); no coverage, linter, type-checker or formatter configured
  Style: Vanilla JS strict mode, CommonJS, no transpiler/bundler; Docker Alpine; docs in Spanish (docs/*.md), code comments mixed; .env.example for secrets

rules:
  proposal:
    - Include rollback plan for risky changes
    - State impact on GenieACS NBI, SQLite, and Docker networking (moca-net)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - One domain per spec file under specs/{domain}/
  design:
    - Include sequence diagrams for TR-069 / gateway flows
    - Document architecture decisions with rationale and alternatives
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Tag tasks affecting NBI, SQLite migrations, or docker-compose
  apply:
    guidelines:
      - Follow existing code patterns (CommonJS, express, better-sqlite3 WAL)
      - Keep changes minimal and reversible; validate against .env.example
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (SQLite schema, NBI contracts)

